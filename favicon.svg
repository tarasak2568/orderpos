<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="orderposBg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF844B" />
            <stop offset="55%" stop-color="#FF6B35" />
            <stop offset="100%" stop-color="#E04714" />
        </linearGradient>
    </defs>

    <!-- App Badge -->
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#orderposBg)" />
    <rect x="5" y="5" width="118" height="118" rx="27" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" />

    <!-- Soft Shadow under Receipt/Terminal Card -->
    <rect x="26" y="25" width="60" height="78" rx="12" fill="#0F172A" fill-opacity="0.18" />

    <!-- POS Slip / Order Card -->
    <rect x="26" y="22" width="60" height="78" rx="12" fill="#FFFFFF" />

    <!-- Terminal Screen / Scan Header -->
    <rect x="35" y="32" width="42" height="16" rx="5" fill="#0F172A" />
    <circle cx="43" cy="40" r="3.5" fill="#FF6B35" />
    <rect x="50" y="38" width="20" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.92" />

    <!-- Order Items Lines -->
    <rect x="35" y="57" width="38" height="7" rx="3.5" fill="#334155" />
    <rect x="35" y="70" width="28" height="7" rx="3.5" fill="#94A3B8" />
    <rect x="35" y="83" width="22" height="7" rx="3.5" fill="#CBD5E1" />

    <!-- Confirmed Order Check Badge -->
    <circle cx="88" cy="86" r="24" fill="#FFFFFF" />
    <circle cx="88" cy="86" r="20" fill="#0F172A" />
    <path d="M79 86.5L85 92.5L98 79.5" stroke="#4ADE80" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
